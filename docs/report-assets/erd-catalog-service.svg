<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#274c77" flood-opacity=".16"/></filter></defs>
<style>.t{font:700 30px Arial;fill:#1d4e89}.e{fill:#dbeafe;stroke:#2563a6;stroke-width:2.4;filter:url(#shadow)}.a{fill:#f8fbff;stroke:#6b8caf;stroke-width:1.7}.r{fill:#fff1c7;stroke:#d39b28;stroke-width:2;filter:url(#shadow)}.n{font:700 18px Arial;fill:#163b65}.x{font:400 15px Arial;fill:#27364a}.k{font:600 15px Arial;fill:#1d4e89;text-decoration:underline}.c{font:700 17px Arial;fill:#b06c00}.l{stroke:#58728e;stroke-width:2;fill:none}.s{font:400 14px Arial;fill:#596779}</style>
<rect width="1600" height="820" fill="#fff"/><text x="800" y="48" text-anchor="middle" class="t">ERD rút gọn – Catalog Service (catalog_db)</text>
