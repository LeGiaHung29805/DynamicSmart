<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#6d3aa8}.entity{fill:#eee5ff;stroke:#7c4db2;stroke-width:2;filter:url(#shadow)}.relation{fill:#fff1c7;stroke:#d39b28;stroke-width:2;filter:url(#shadow)}.attr{fill:#fdfbff;stroke:#9b7cbd;stroke-width:1.6}.line{stroke:#756286;stroke-width:2;fill:none}.ename{font:700 17px Arial,sans-serif;fill:#593087}.rname{font:600 15px Arial,sans-serif;fill:#805b08}.atext{font:14px Arial,sans-serif;fill:#1f2937}.card{font:700 16px Arial,sans-serif;fill:#b06c00}.note{font:13px Arial,sans-serif;fill:#4b5563}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d3aa8" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1600" height="820" fill="#fff"/>
  <text x="800" y="48" text-anchor="middle" class="title">ERD RÚT GỌN – PAYMENT SERVICE</text>

  <path class="line" d="M360 385H480M600 385H690M930 385H1040M1160 385H1240"/>

  <!-- Payments -->
  <rect x="100" y="335" width="260" height="100" rx="3" class="entity"/>
  <text x="230" y="393" text-anchor="middle" class="ename">THANH TOÁN</text>
  <ellipse cx="130" cy="185" rx="78" ry="29" class="attr"/><text x="130" y="190" text-anchor="middle" class="atext">id (PK)</text>
  <ellipse cx="320" cy="220" rx="94" ry="29" class="attr"/><text x="320" y="225" text-anchor="middle" class="atext">order_id (LR)</text>
  <ellipse cx="120" cy="555" rx="105" ry="29" class="attr"/><text x="120" y="560" text-anchor="middle" class="atext">customer_id (LR)</text>
  <ellipse cx="330" cy="555" rx="112" ry="29" class="attr"/><text x="330" y="560" text-anchor="middle" class="atext">payment_method</text>
  <ellipse cx="230" cy="650" rx="94" ry="29" class="attr"/><text x="230" y="655" text-anchor="middle" class="atext">amount_vnd</text>
  <path class="line" d="M130 214L185 335M320 249L280 335M120 526L180 435M330 526L280 435M230 621V435"/>

  <!-- Has attempts -->
  <polygon points="540,325 600,385 540,445 480,385" class="relation"/>
  <text x="540" y="390" text-anchor="middle" class="rname">PHÁT SINH</text>
  <text x="430" y="370" class="card">1</text><text x="635" y="370" class="card">N</text>

  <!-- Payment attempts -->
  <rect x="690" y="335" width="240" height="100" rx="3" class="entity"/>
  <text x="810" y="393" text-anchor="middle" class="ename">LẦN THANH TOÁN</text>
  <ellipse cx="650" cy="185" rx="78" ry="29" class="attr"/><text x="650" y="190" text-anchor="middle" class="atext">id (PK)</text>
  <ellipse cx="830" cy="175" rx="105" ry="29" class="attr"/><text x="830" y="180" text-anchor="middle" class="atext">payment_id (FK)</text>
  <ellipse cx="980" cy="240" rx="92" ry="29" class="attr"/><text x="980" y="245" text-anchor="middle" class="atext">attempt_no</text>
  <ellipse cx="695" cy="555" rx="80" ry="29" class="attr"/><text x="695" y="560" text-anchor="middle" class="atext">channel</text>
  <ellipse cx="900" cy="555" rx="128" ry="29" class="attr"/><text x="900" y="560" text-anchor="middle" class="atext">provider_reference</text>
  <path class="line" d="M650 214L740 335M830 204L815 335M980 269L875 335M695 526L750 435M900 526L860 435"/>

  <!-- Callback audit -->
  <polygon points="1100,325 1160,385 1100,445 1040,385" class="relation"/>
  <text x="1100" y="390" text-anchor="middle" class="rname">GHI NHẬN</text>
  <text x="985" y="370" class="card">1</text><text x="1195" y="370" class="card">N</text>
  <rect x="1240" y="335" width="290" height="100" rx="3" class="entity"/>
  <text x="1385" y="382" text-anchor="middle" class="ename">NHẬT KÝ PHẢN HỒI</text>
  <text x="1385" y="406" text-anchor="middle" class="ename">THANH TOÁN</text>
  <ellipse cx="1250" cy="190" rx="78" ry="29" class="attr"/><text x="1250" y="195" text-anchor="middle" class="atext">id (PK)</text>
  <ellipse cx="1450" cy="220" rx="132" ry="29" class="attr"/><text x="1450" y="225" text-anchor="middle" class="atext">payment_attempt_id (FK)</text>
  <ellipse cx="1255" cy="555" rx="105" ry="29" class="attr"/><text x="1255" y="560" text-anchor="middle" class="atext">checksum_valid</text>
  <ellipse cx="1450" cy="555" rx="85" ry="29" class="attr"/><text x="1450" y="560" text-anchor="middle" class="atext">decision</text>
  <path class="line" d="M1250 219L1320 335M1450 249L1425 335M1255 526L1325 435M1450 526L1420 435"/>

  <text x="85" y="770" class="note">PK: khóa chính   •   FK: khóa ngoại nội bộ   •   LR: tham chiếu logic đến Order/Identity Service</text>
</svg>
