<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <style>
      .title{font:600 28px Arial,sans-serif;fill:#172033}.label{font:600 18px Arial,sans-serif;fill:#172033}.sub{font:400 15px Arial,sans-serif;fill:#48566a}.box{fill:#fff;stroke:#53657a;stroke-width:2}.endpoint{fill:#eef4fa;stroke:#385a7a;stroke-width:2}.db{fill:#f6f7f9;stroke:#53657a;stroke-width:2}.arrow{stroke:#53657a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53657a"/></marker>
  </defs>
  <rect width="1600" height="620" fill="#fff"/>
  <text x="800" y="55" text-anchor="middle" class="title">Luồng lấy danh sách sản phẩm</text>

  <rect x="55" y="190" width="230" height="120" rx="12" class="endpoint"/>
  <text x="170" y="235" text-anchor="middle" class="label">HTTP Request</text>
  <text x="170" y="270" text-anchor="middle" class="sub">GET</text>
  <text x="170" y="294" text-anchor="middle" class="sub">/api/v1/catalog/products</text>

  <rect x="325" y="190" width="230" height="120" rx="12" class="box"/>
  <text x="440" y="240" text-anchor="middle" class="label">PublicProductController</text>
  <text x="440" y="276" text-anchor="middle" class="sub">Tiếp nhận yêu cầu</text>

  <rect x="595" y="190" width="230" height="120" rx="12" class="box"/>
  <text x="710" y="240" text-anchor="middle" class="label">CatalogQueryService</text>
  <text x="710" y="276" text-anchor="middle" class="sub">Xử lý truy vấn catalog</text>

  <rect x="865" y="190" width="250" height="120" rx="12" class="box"/>
  <text x="990" y="232" text-anchor="middle" class="label">CatalogProduct</text>
  <text x="990" y="256" text-anchor="middle" class="label">QueryRepository</text>
  <text x="990" y="286" text-anchor="middle" class="sub">Truy vấn dữ liệu</text>

  <path d="M1165 210 C1165 190 1375 190 1375 210 L1375 292 C1375 316 1165 316 1165 292 Z" class="db"/>
  <ellipse cx="1270" cy="210" rx="105" ry="22" class="db"/>
  <text x="1270" y="248" text-anchor="middle" class="label">catalog_db</text>
  <text x="1270" y="278" text-anchor="middle" class="sub">PostgreSQL</text>

  <rect x="595" y="430" width="410" height="105" rx="12" class="endpoint"/>
  <text x="800" y="472" text-anchor="middle" class="label">HTTP Response</text>
  <text x="800" y="505" text-anchor="middle" class="sub">Danh sách sản phẩm dạng JSON</text>

  <path d="M285 250H315" class="arrow"/>
  <path d="M555 250H585" class="arrow"/>
  <path d="M825 250H855" class="arrow"/>
  <path d="M1115 250H1155" class="arrow"/>
  <path d="M1270 317V365H800V420" class="arrow"/>
</svg>
