<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title{font:600 28px Arial,sans-serif;fill:#172033}.label{font:600 18px Arial,sans-serif;fill:#172033}.sub{font:400 15px Arial,sans-serif;fill:#48566a}.box{fill:#fff;stroke:#53657a;stroke-width:2}.endpoint{fill:#eef4fa;stroke:#385a7a;stroke-width:2}.db{fill:#f6f7f9;stroke:#53657a;stroke-width:2}.arrow{stroke:#53657a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53657a"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="55" text-anchor="middle" class="title">Luồng tạo đơn hàng</text>

  <rect x="70" y="150" width="260" height="120" rx="12" class="endpoint"/>
  <text x="200" y="194" text-anchor="middle" class="label">HTTP Request</text>
  <text x="200" y="228" text-anchor="middle" class="sub">POST</text>
  <text x="200" y="252" text-anchor="middle" class="sub">/api/v1/checkout/orders</text>

  <rect x="390" y="150" width="260" height="120" rx="12" class="box"/>
  <text x="520" y="200" text-anchor="middle" class="label">OrderCheckoutController</text>
  <text x="520" y="236" text-anchor="middle" class="sub">Tiếp nhận yêu cầu tạo đơn</text>

  <rect x="710" y="150" width="300" height="120" rx="12" class="box"/>
  <text x="860" y="200" text-anchor="middle" class="label">OrderCreationAdmissionService</text>
  <text x="860" y="236" text-anchor="middle" class="sub">Kiểm tra điều kiện tiếp nhận</text>

  <rect x="1070" y="150" width="310" height="120" rx="12" class="box"/>
  <text x="1225" y="200" text-anchor="middle" class="label">OrderCreationRevalidationService</text>
  <text x="1225" y="236" text-anchor="middle" class="sub">Kiểm tra lại dữ liệu nghiệp vụ</text>

  <rect x="1070" y="420" width="310" height="120" rx="12" class="box"/>
  <text x="1225" y="470" text-anchor="middle" class="label">OrderReservationService</text>
  <text x="1225" y="506" text-anchor="middle" class="sub">Giữ tồn kho và voucher</text>

  <rect x="710" y="420" width="300" height="120" rx="12" class="box"/>
  <text x="860" y="462" text-anchor="middle" class="label">OrderCreation</text>
  <text x="860" y="486" text-anchor="middle" class="label">PersistenceService</text>
  <text x="860" y="516" text-anchor="middle" class="sub">Lưu đơn hàng</text>

  <path d="M430 440 C430 420 650 420 650 440 L650 522 C650 546 430 546 430 522 Z" class="db"/>
  <ellipse cx="540" cy="440" rx="110" ry="22" class="db"/>
  <text x="540" y="478" text-anchor="middle" class="label">order_db</text>
  <text x="540" y="508" text-anchor="middle" class="sub">PostgreSQL</text>

  <rect x="590" y="690" width="420" height="105" rx="12" class="endpoint"/>
  <text x="800" y="732" text-anchor="middle" class="label">HTTP Response</text>
  <text x="800" y="765" text-anchor="middle" class="sub">Kết quả tạo đơn hàng</text>

  <path d="M330 210H380" class="arrow"/>
  <path d="M650 210H700" class="arrow"/>
  <path d="M1010 210H1060" class="arrow"/>
  <path d="M1225 270V410" class="arrow"/>
  <path d="M1070 480H1020" class="arrow"/>
  <path d="M710 480H660" class="arrow"/>
  <path d="M540 547V620H800V680" class="arrow"/>
</svg>
