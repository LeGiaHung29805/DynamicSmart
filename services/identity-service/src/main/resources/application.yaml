spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./identity-service/.env[.properties],optional:file:./services/identity-service/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed/local

server:
  port: ${SERVER_PORT:8081}

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:dynamicmart-identity-service}
      hmac-secret-base64: ${JWT_HMAC_SECRET_BASE64}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
