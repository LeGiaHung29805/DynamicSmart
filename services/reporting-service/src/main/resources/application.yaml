spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./reporting-service/.env[.properties],optional:file:./services/reporting-service/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: reporting-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reporting_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    function:
      definition: reportingEvents
    stream:
      bindings:
        reportingEvents-in-0:
          destination: dynamicmart.events
          group: reporting-service
          content-type: application/json
          consumer:
            max-attempts: 5
      rabbit:
        bindings:
          reportingEvents-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
              requeue-rejected: false
              dead-letter-exchange: dynamicmart.events.dlx
              dead-letter-queue-name: dynamicmart.events.reporting-service.dlq
              dead-letter-routing-key: reporting-service.failed

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:dynamicmart-identity-service}
      hmac-secret-base64: ${JWT_HMAC_SECRET_BASE64:CiYZjVClqyvwboeDW62WjNYyVrBx0rnxn1H5RqWOfCY=}
