spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./cart-service/.env[.properties],optional:file:./services/cart-service/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cart_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: cart-service

server:
  port: ${SERVER_PORT:8083}

app:
  voucher:
    expiry-scan-ms: ${VOUCHER_EXPIRY_SCAN_MS:30000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:dynamicmart-identity-service}
      hmac-secret-base64: ${JWT_HMAC_SECRET_BASE64}
    internal-api-key: ${INTERNAL_API_KEY}
