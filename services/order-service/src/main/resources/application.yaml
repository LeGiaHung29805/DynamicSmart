spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./order-service/.env[.properties],optional:file:./services/order-service/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    function:
      definition: paymentEvents
    stream:
      bindings:
        paymentEvents-in-0:
          destination: dynamicmart.events
          group: order-service
          content-type: application/json
          consumer:
            max-attempts: 5
        orderEvents-out-0:
          destination: dynamicmart.events
          content-type: application/json
        paymentDue-out-0:
          destination: payment.due
          content-type: application/json
      rabbit:
        bindings:
          paymentEvents-in-0:
            consumer:
              auto-bind-dlq: true
              republish-to-dlq: true
              requeue-rejected: false
              dead-letter-exchange: dynamicmart.events.dlx
              dead-letter-queue-name: dynamicmart.events.order-service.dlq
              dead-letter-routing-key: order-service.payment.failed

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:dynamicmart-identity-service}
      hmac-secret-base64: ${JWT_HMAC_SECRET_BASE64}
  checkout:
    session-ttl: ${CHECKOUT_SESSION_TTL:15m}
  saga-recovery:
    enabled: ${ORDER_SAGA_RECOVERY_ENABLED:true}
    fixed-delay: ${ORDER_SAGA_RECOVERY_FIXED_DELAY:30s}
    initial-delay: ${ORDER_SAGA_RECOVERY_INITIAL_DELAY:30s}
    stale-after: ${ORDER_SAGA_RECOVERY_STALE_AFTER:30s}
    lease-duration: ${ORDER_SAGA_RECOVERY_LEASE_DURATION:2m}
    retry-backoff: ${ORDER_SAGA_RECOVERY_RETRY_BACKOFF:1m}
    batch-size: ${ORDER_SAGA_RECOVERY_BATCH_SIZE:20}
  outbox:
    publish-delay: ${ORDER_OUTBOX_PUBLISH_DELAY:1s}
    batch-size: ${ORDER_OUTBOX_BATCH_SIZE:100}
  clients:
    identity-base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
    catalog-base-url: ${CATALOG_SERVICE_BASE_URL:http://localhost:8082}
    cart-base-url: ${CART_SERVICE_BASE_URL:http://localhost:8083}
    payment-base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8085}
    connect-timeout: ${SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${SERVICE_READ_TIMEOUT:5s}
    internal-api-key: ${INTERNAL_API_KEY:}
