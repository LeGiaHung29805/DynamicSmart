spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./order-service/.env[.properties],optional:file:./services/order-service/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:dynamicmart-identity-service}
      hmac-secret-base64: ${JWT_HMAC_SECRET_BASE64}
  checkout:
    session-ttl: ${CHECKOUT_SESSION_TTL:15m}
  clients:
    identity-base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
    catalog-base-url: ${CATALOG_SERVICE_BASE_URL:http://localhost:8082}
    cart-base-url: ${CART_SERVICE_BASE_URL:http://localhost:8083}
    payment-base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8085}
    connect-timeout: ${SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${SERVICE_READ_TIMEOUT:5s}
    internal-api-key: ${INTERNAL_API_KEY:}
