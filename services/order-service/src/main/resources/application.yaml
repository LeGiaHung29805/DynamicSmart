spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./order-service/.env[.properties],optional:file:./services/order-service/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    function:
      definition: paymentEvents
    stream:
      bindings:
        paymentEvents-in-0:
          destination: dynamicmart.events
          group: order-service
          content-type: application/json

server:
  port: ${SERVER_PORT:8084}

app:
  clients:
    cart-service-url: ${CART_SERVICE_BASE_URL:http://localhost:8083}
    payment-service-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8085}
  security:
    jwt:
      issuer: ${JWT_ISSUER:dynamicmart-identity-service}
      hmac-secret-base64: ${JWT_HMAC_SECRET_BASE64}
    internal-api-key: ${INTERNAL_API_KEY}
