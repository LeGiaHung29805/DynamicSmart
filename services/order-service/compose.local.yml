name: dynamicmart-order-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - order_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: order_user
      RABBITMQ_DEFAULT_PASS: order_password
    ports:
      - "127.0.0.1:5674:5672"
      - "127.0.0.1:15674:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - order_rabbitmq_data:/var/lib/rabbitmq

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: order_user
      DB_PASSWORD: order_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: order_user
      RABBITMQ_PASSWORD: order_password
      JWT_ISSUER: dynamicmart-identity-service
      JWT_HMAC_SECRET_BASE64: CiYZjVClqyvwboeDW62WjNYyVrBx0rnxn1H5RqWOfCY=
      INTERNAL_API_KEY: dynamicmart-local-internal-key-2026
      IDENTITY_SERVICE_BASE_URL: ${IDENTITY_SERVICE_BASE_URL:-http://host.docker.internal:8081}
      CATALOG_SERVICE_BASE_URL: ${CATALOG_SERVICE_BASE_URL:-http://host.docker.internal:8082}
      CART_SERVICE_BASE_URL: ${CART_SERVICE_BASE_URL:-http://host.docker.internal:8083}
      PAYMENT_SERVICE_BASE_URL: ${PAYMENT_SERVICE_BASE_URL:-http://host.docker.internal:8085}
      ORDER_SAGA_RECOVERY_ENABLED: "true"
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  order_postgres_data:
  order_rabbitmq_data:
