spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./engagement-service/.env[.properties],optional:file:./services/engagement-service/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: engagement-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/engagement_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    stream:
      bindings:
        reviewEvents-out-0:
          destination: dynamicmart.events
          content-type: application/json

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  clients:
    order-service-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8084}
    catalog-service-url: ${CATALOG_SERVICE_BASE_URL:http://localhost:8082}
  security:
    jwt:
      issuer: ${JWT_ISSUER:dynamicmart-identity-service}
      hmac-secret-base64: ${JWT_HMAC_SECRET_BASE64}
    internal-api-key: ${INTERNAL_API_KEY:}

