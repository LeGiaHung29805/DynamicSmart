spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./engagement-service/.env[.properties],optional:file:./services/engagement-service/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: engagement-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/engagement_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
