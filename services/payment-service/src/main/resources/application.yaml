spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./payment-service/.env[.properties],optional:file:./services/payment-service/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    function:
      definition: paymentDue
    stream:
      bindings:
        paymentDue-in-0:
          destination: payment.due
          group: payment-service

server:
  port: ${SERVER_PORT:8085}

app:
  internal:
    api-key: ${INTERNAL_API_KEY:}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    payment-url: ${VNPAY_PAYMENT_URL:}
    return-url: ${VNPAY_RETURN_URL:http://localhost:3000/checkout/payment/result}
    hash-secret: ${VNPAY_HASH_SECRET:}
    expiry-scan-delay-ms: ${VNPAY_EXPIRY_SCAN_DELAY_MS:60000}
  ghn:
    base-url: ${GHN_BASE_URL:}
    token: ${GHN_TOKEN:}
    shop-id: ${GHN_SHOP_ID:}
    from-district-id: ${GHN_FROM_DISTRICT_ID:}
    quote-ttl-minutes: ${GHN_QUOTE_TTL_MINUTES:15}
