spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:./payment-service/.env[.properties],optional:file:./services/payment-service/.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  task:
    scheduling:
      pool:
        size: 4
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    function:
      definition: paymentDue
    stream:
      bindings:
        paymentDue-in-0:
          destination: payment.due
          group: payment-service
        paymentEvents-out-0:
          destination: dynamicmart.events
          content-type: application/json

server:
  port: ${SERVER_PORT:8085}

app:
  internal:
    api-key: ${INTERNAL_API_KEY:}
  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    payment-url: ${VNPAY_PAYMENT_URL:${VNPAY_URL:}}
    return-url: ${VNPAY_RETURN_URL:http://localhost:3000/checkout/payment/result}
    hash-secret: ${VNPAY_HASH_SECRET:}
    expiry-scan-delay-ms: ${VNPAY_EXPIRY_SCAN_DELAY_MS:60000}
  zalopay:
    app-id: ${ZALOPAY_APP_ID:}
    key1: ${ZALOPAY_KEY1:}
    key2: ${ZALOPAY_KEY2:}
    create-url: ${ZALOPAY_CREATE_URL:https://sb-openapi.zalopay.vn/v2/create}
    callback-url: ${ZALOPAY_CALLBACK_URL:}
    return-url: ${ZALOPAY_RETURN_URL:http://localhost:3000/checkout/payment/result}
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    return-url: ${PAYOS_RETURN_URL:http://localhost:3000/checkout/payment/result}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/checkout/payment/result}
  sepay:
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
    bank-id: ${PAYMENT_QR_BANK_ID:}
    account-no: ${PAYMENT_QR_ACCOUNT_NO:}
    account-name: ${PAYMENT_QR_ACCOUNT_NAME:}
    qr-base-url: ${PAYMENT_QR_BASE_URL:https://vietqr.app/img}
  ghn:
    base-url: ${GHN_BASE_URL:}
    token: ${GHN_TOKEN:}
    shop-id: ${GHN_SHOP_ID:}
    from-district-id: ${GHN_FROM_DISTRICT_ID:}
    from-ward-code: ${GHN_FROM_WARD_CODE:}
    quote-ttl-minutes: ${GHN_QUOTE_TTL_MINUTES:15}
    catalog-sync-initial-delay-ms: ${GHN_CATALOG_SYNC_INITIAL_DELAY_MS:1000}
    catalog-sync-delay-ms: ${GHN_CATALOG_SYNC_DELAY_MS:86400000}
